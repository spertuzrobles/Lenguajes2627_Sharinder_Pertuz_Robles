<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo Flexbox</title>
  <style>
    body {
      margin: 0;
      background-color: #f8b6f8;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      box-sizing: border-box;
    }

    /* Header centrado moderno */
    header {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      background-color: #c529f579;
      color: white;
      padding: 20px 0;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      font-size: 1.5em;
      font-weight: bold;
    }

    .contenedor {
      border: 2px solid darkblue;
      width: 1200px;
      height: 700px;
      display: flex;
      flex-direction:row;
      justify-content: center;
      gap: 15px;
      align-items: flex-start;
      padding: 20px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      flex-wrap: wrap;
    }

    .caja {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: steelblue;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
    }

    .caja1{
      width: 200px;
      height: 150px;
      background-color: pink;
    }
    .caja2 {
      width: 200px;
      height: 150px;
    }

    .caja3 {
      width: 200px;
      height: 150px;
      background-color: tomato;
    }

    .caja4 {
      width: 200px;
      height: 150px;
      background-color: seagreen;
    }
  </style>
</head>
<body>
